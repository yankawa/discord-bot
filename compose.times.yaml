services:
  times-bot:
    build:
      context: .
      args:
        BOT: times-bot
    env_file:
      - .env.times
    environment:
      STATE_FILE: /app/data/owner.json
    volumes:
      - owner-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  owner-data:
