name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build (Linux amd64)
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check runner platform
        run: |
          if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
            printf '%s\n' '::error::CI_RUNNER_LABELS must select a Linux X64 runner.'
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          unformatted_files="$(gofmt -l .)"
          if [[ -n "$unformatted_files" ]]; then
            printf '%s\n' "$unformatted_files"
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run static checks
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: make build

      - name: Package binaries
        run: |
          mkdir -p dist/package
          cp bin/times-bot bin/utils-bot dist/package/
          cp -R licenses dist/package/licenses
          (
            cd dist/package
            sha256sum times-bot utils-bot > CHECKSUMS.sha256
          )
          tar -czf dist/discord-bots-linux-amd64.tar.gz -C dist/package .

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-bots-linux-amd64
          path: dist/discord-bots-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
