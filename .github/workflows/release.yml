name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum

      - name: Verify source
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          make build VERSION="${GITHUB_REF_NAME#v}"

      - name: Package separately installable bots
        run: |
          set -euo pipefail
          for bot in times-bot utils-bot; do
            mkdir -p "dist/$bot"
            cp "bin/$bot" LICENSE README.md README.en.md "dist/$bot/"
            cp -R licenses "dist/$bot/licenses"
            (
              cd "dist/$bot"
              sha256sum "$bot" > CHECKSUMS.sha256
            )
            tar -czf "dist/$bot-linux-amd64.tar.gz" -C "dist/$bot" .
          done
          (
            cd dist
            sha256sum times-bot-linux-amd64.tar.gz utils-bot-linux-amd64.tar.gz > SHA256SUMS
          )

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/times-bot-linux-amd64.tar.gz \
            dist/utils-bot-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            --generate-notes --verify-tag
